name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - run: python -m pip install -r requirements.txt ruff build
      - run: python -m ruff check .
      - name: Linux tests
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/check.py --require-gui
      - name: Windows and macOS tests
        if: runner.os != 'Linux'
        run: python scripts/check.py --require-gui
      - run: python -m build
      - name: Install the built wheel
        run: python -m pip install --no-index --no-deps --find-links dist image-enhancer
      - name: Check the installed desktop entry point
        working-directory: ${{ runner.temp }}
        shell: python
        run: |
          from importlib.metadata import distribution
          from shutil import which

          entry, = distribution("image-enhancer").entry_points.select(group="gui_scripts", name="image-enhancer")
          assert which("image-enhancer")
          assert callable(entry.load())
